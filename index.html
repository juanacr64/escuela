<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escuela de niños creativos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .container {
            width: 800px;
            max-width: 100%;
            margin-left: auto;
            margin-right: auto;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .box {
            padding: 20px;
            margin-bottom: 10px;
            border-radius: 4px;
            color: #ffffff;
            box-sizing: border-box;
            display: inline-block;
            width: 100%;
        }

        .c1 { background-color: #e06d53; }
        .c2 { background-color: #e59866; }
        .c3 { background-color: #f39c12; }
        .c4 { background-color: #5dade2; }
        .c5 { background-color: #af7ac5; }

        @media (min-width: 600px) {
            .c2, .c3, .c4, .c5 {
                width: 50%;
                float: left;
            }
        }

        @media (min-width: 800px) {
            .c1 { width: 100%; float: none; }
            .c2 { width: 100%; float: none; }
            .c3, .c4, .c5 { width: 33.33%; float: left; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Escuela de niños creativos</h1>
        <div class="c1 box">Crítica: Espacio para evaluar proyectos</div>
        <div class="c2 box">Código: Desarrollo web base</div>
        <div class="c3 box">Arte: Diseño gráfico infantil</div>
        <div class="c4 box">Robótica: Primeros pasos</div>
        <div class="c5 box">Aprende jugando: Lógica y diversión</div>
    </div>
</body>
</html>
